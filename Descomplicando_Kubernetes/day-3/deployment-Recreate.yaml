apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx-deployment
  name: nginx-deployment
  namespace: giropops
spec:
  replicas: 20
  selector:
    matchLabels:
      app: nginx-deployment
  strategy:
    type: Recreate #Mata tudo e cria tudo de novo com a nova versão, com downtime
  template:
    metadata:
      labels:
        app: nginx-deployment
    spec:
      containers:
      - image: nginx:1.15.0
        name: nginx
        resources:
          limits:
            cpu: "0.7"
            memory: "256Mi"
          requests:
            cpu: "0.3"
            memory: "64Mi"
