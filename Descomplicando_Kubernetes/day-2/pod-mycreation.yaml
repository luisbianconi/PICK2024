apiVersion: v1
kind: Pod
metadata:
  name: podluis
  labels:
    run: podluis
spec:
  containers:
  - image: nginx
    name: luis-nginx
    resources:
      limits:
        cpu: "1"
        memory: "256Mi"
      requests:
        cpu: "0.5"
        memory: "64Mi"
  dnsPolicy: ClusterFirst
  restartPolicy: Always
